[workspace]
resolver = "2"
members = [
    "crates/ferredge-bridge",
    "crates/ferredge-bridge-interop",
    "crates/ferredge-core",
    "crates/ferredge-proto-http",
    "crates/ferredge-proto-modbus",
    "crates/ferredge-proto-mqtt",
    "crates/ferredge-runtime-tokio",
    "crates/ferredge-runtime-async-std",
    "crates/ferredge-runtime-embassy",
    "crates/ferredge-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ferredge/ferredge"
rust-version = "1.93"

[workspace.dependencies]
# Internal crates
ferredge-bridge = { path = "crates/ferredge-bridge" }
ferredge-bridge-interop = { path = "crates/ferredge-bridge-interop" }
ferredge-core = { path = "crates/ferredge-core" }
ferredge-proto-http = { path = "crates/ferredge-proto-http" }
ferredge-proto-modbus = { path = "crates/ferredge-proto-modbus" }
ferredge-proto-mqtt = { path = "crates/ferredge-proto-mqtt" }
ferredge-runtime-tokio = { path = "crates/ferredge-runtime-tokio" }
ferredge-runtime-async-std = { path = "crates/ferredge-runtime-async-std" }
ferredge-runtime-embassy = { path = "crates/ferredge-runtime-embassy" }
ferredge-test-support = { path = "crates/ferredge-test-support" }

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = { version = "2", default-features = false }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Unique identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Runtimes
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
async-std = { version = "1", features = ["attributes"] }
tokio-serial = "5.4.5"
serialport = "4.8.1"
rmodbus = { version = "0.12.2", default-features = false, features = ["alloc"] }
dynosaur = "0.3"
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-net = { version = "0.9", default-features = false, features = [
    "tcp",
    "udp",
    "proto-ipv4",
    "proto-ipv6",
    "medium-ethernet",
] }
embassy-net-driver = "0.2"
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-io-async = "0.7"
critical-section = "1"
static_cell = "2"
heapless = "0.9"
