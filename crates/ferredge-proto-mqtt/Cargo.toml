[package]
name = "ferredge-proto-mqtt"
description = "MQTT protocol support for ferredge - device and data aggregator for edge devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `std` enables common std support. Runtime stack selection happens via stack-specific features.
default = ["tokio-runtime"]
std = ["ferredge-core/std", "ferredge-bridge/std", "mqtt_protocol_core/std", "serde/std"]
tokio-runtime = ["std", "dep:ferredge-runtime-tokio", "ferredge-runtime-tokio/runtime", "ferredge-runtime-tokio/net"]
async-std-runtime = ["std", "dep:ferredge-runtime-async-std", "ferredge-runtime-async-std/runtime", "ferredge-runtime-async-std/net"]
embassy-runtime = ["dep:ferredge-runtime-embassy", "ferredge-runtime-embassy/runtime", "ferredge-runtime-embassy/net"]
# Integration tests that require external dependencies or setup can be gated behind this feature.
integration = []

[dependencies]
ferredge-core = { workspace = true, features = ["net", "runtime", "sync"] }
ferredge-bridge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
mqtt_protocol_core = { package = "mqtt-protocol-core", version = "0.7.7", default-features = false }
thiserror = { workspace = true }
ferredge-runtime-tokio = { workspace = true, optional = true }
ferredge-runtime-async-std = { workspace = true, optional = true }
ferredge-runtime-embassy = { workspace = true, optional = true }

[dev-dependencies]
ferredge-test-support = { workspace = true, features = ["tokio-runtime"] }
