[package]
name = "ferredge-runtime-async-std"
description = "async-std runtime and network adapters for ferredge core traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
runtime = ["dep:async-std", "ferredge-core/std", "ferredge-core/runtime"]
net = ["dep:async-std", "ferredge-core/std", "ferredge-core/net"]
serial = ["dep:async-std", "dep:serialport", "ferredge-core/std", "ferredge-core/serial"]

[dependencies]
ferredge-core = { workspace = true }
async-std = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }
