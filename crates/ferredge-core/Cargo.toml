[package]
name = "ferredge-core"
description = "Core library for ferredge - device and data aggregator for edge devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
std = ["serde/std", "bitflags/std"]
# Erases the Send/Sync bounds on runtime/net/serial/sync traits so single-executor
# runtimes (e.g. embassy) can implement them. Incompatible with the tokio/async-std
# adapters in the same build; enable only via a single-executor adapter crate.
local = []
hashbrown = ["dep:hashbrown"]
sync = []
runtime = ["sync"]
net = []
serial = []

[dependencies]
serde = { workspace = true }
bitflags = { version = "2.10.0", default-features = false, features = ["serde"] }
hashbrown = { version = "0.17", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
