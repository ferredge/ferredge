[package]
name = "ferredge-proto-zenoh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ferredge-core = { workspace = true }
ferredge-bridge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, default-features = false }

# Runtime dependencies (optional, feature-gated)
ferredge-runtime-tokio = { workspace = true, optional = true }
ferredge-runtime-async-std = { workspace = true, optional = true }
ferredge-runtime-embassy = { workspace = true, optional = true }

# Zenoh protocol libraries
zenoh = { version = "1.0", optional = true, default-features = false }
zenoh-nostd = { git = "https://github.com/eclipse-zenoh/zenoh-nostd", optional = true, default-features = false }

[dev-dependencies]
ferredge-test-support = { workspace = true }

[features]
default = ["tokio-runtime"]

# std vs no_std - controls which Zenoh backend to use
std = [
    "ferredge-core/std",
    "ferredge-bridge/std",
    "serde/std",
    "tracing/std",
    "dep:zenoh",
]
no_std = [
    "dep:zenoh-nostd",
]

# Runtime implementations
tokio-runtime = [
    "std",
    "dep:ferredge-runtime-tokio",
    "ferredge-runtime-tokio/runtime",
    "ferredge-core/net",
    "zenoh/transport_tcp",
    "zenoh/transport_udp",
]
async-std-runtime = [
    "std",
    "dep:ferredge-runtime-async-std",
    "ferredge-runtime-async-std/runtime",
    "ferredge-core/net",
    "zenoh/transport_tcp",
    "zenoh/transport_udp",
]
embassy-runtime = [
    "no_std",
    "dep:ferredge-runtime-embassy",
    "ferredge-runtime-embassy/runtime",
    "ferredge-runtime-embassy/net",
]

# Integration tests
integration = []
